# Where people act (the Open Autonomy kit's ADR 0008, human seams): each seam's roster scope, the door its acts go through,
# and where they are recorded; and the vendor accounts whose administrators are people in scope. JSON is a YAML value.
seams: {"seams": [{"id": "roster", "scope": "owner", "door": "commit", "record": ".open-autonomy/config.yaml team, changed through a reviewed pull request"}, {"id": "spending-bounds", "scope": "owner", "door": "commit", "record": ".open-autonomy/config.yaml spend limits and rails bounds"}, {"id": "direction", "scope": "direction", "door": "commit", "record": "GitHub issues and comments by the verified account of a member holding direction, and ROADMAP.md as landed; chat is a request"}, {"id": "release-approval", "scope": "release-review", "door": "code-host-gate", "record": "GitHub releases of open-autonomy-org/evidence-desk (v<version> tags on a landed candidate), each created on GitHub by a member holding release-review after reviewing the candidate (CONTRIBUTING.md)"}, {"id": "compliance-signing", "scope": "owner", "door": "code-host-gate", "record": "Approvals of sign/ pull requests in open-autonomy-org/evidence-desk-compliance, merged by its signing workflow and checked by evidence-desk collect attribution"}, {"id": "pause", "scope": "owner", "door": "platform-key", "record": "The project's books on the Open Autonomy platform"}], "vendor_accounts": [{"id": "github", "vendor": "github", "account": "open-autonomy-org"}, {"id": "openai", "vendor": "openai", "account": "the OpenAI (Codex) subscription whose login the host's valve uses for the development agent's models"}, {"id": "open-autonomy", "vendor": "open-autonomy", "account": "the project's key on the Open Autonomy platform (books, payments, pause)"}, {"id": "discord", "vendor": "discord", "account": "the project's Discord application and the server holding channel 1546981849979682916"}]}

# What the reporter publishes. Work sessions (the scheduled runs, the funded work) publish by default; the
# private exceptions are named here. Anything listed under `private` is never sent.
publish:
  runs: true        # sessions the schedule started (trigger: cron)
  chats: false      # conversations on a channel (Discord, a terminal)
  private: []       # session IDs, job IDs or job names that never publish

# Where sessions come from: the Hermes home the reporter reads through supercode (HERMES_HOME in its
# environment), and where it keeps its own cursor (beside this file).
state_file: reporter-state.json

# The models the project's funds may buy on the platform's model rail: a bound the platform reads from this file and
# holds whatever a key was minted with. Empty: any model the gateway serves (`GET /v1/catalog` lists them).
# Provisional starter value: select a verified development model before activation.
models: [zai/glm-5.3-flash]

# The limits the project's funds run under on the platform's model rail, each over its own rolling window, all held at
# once, the call that would cross one refused with its name: the money (usd_cents), the pace (calls) or the volume
# (tokens, in and out), for everything or for one model (`model:`). Windows: 1m…60m, 1h…24h, 1d…31d. The kit's
# defaults: five dollars a day, sixty a month, and a pace no runaway loop keeps up.
# These starter limits are proposals, not funding or authorization to spend.
spend:
  limits:
    - { window: 1d, usd_cents: 500 }
    - { window: 30d, usd_cents: 6000 }
    - { window: 1m, calls: 60 }

# The rails the agent may spend through beyond model calls, and the owner's bounds on each. Off unless a
# bound is set. Every rail leaves a record on the public audit trail naming itself.
rails:
  card:                       # a single-use virtual card minted against the balance (Stripe Issuing)
    max_usd_cents: 0          # the most one card may be minted for
    categories: []            # Stripe merchant categories a card may pay at, e.g. [computer_software_stores]
  partner:                    # a partner service settling a metered charge against the balance
    max_usd_cents: 0          # the most one charge may be
    partners: []              # the partner ids allowed to settle
